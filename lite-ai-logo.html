<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>LITE-AI Logo</title>
<style>
  html,body{margin:0;padding:0;height:100%;}
  body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <!-- 背景 -->
  <rect width="800" height="300" fill="#000000"/>
  
  <!-- 安全帽 -->
  <path d="M 80 80 Q 80 40 120 40 Q 160 40 160 80 L 165 90 L 75 90 Z" 
        fill="#808080" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 85 85 L 95 50 M 120 45 L 120 85 M 145 50 L 155 85" 
        stroke="#404040" stroke-width="2"/>
  
  <!-- 扳手1 (交叉) -->
  <path d="M 60 180 L 140 100 L 155 115 L 75 195 Z" 
        fill="#606060" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="145" cy="105" r="8" fill="#808080" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 55 185 L 65 175 M 70 200 L 80 190" 
        stroke="#FFFFFF" stroke-width="3"/>
  
  <!-- 扳手2 (交叉) -->
  <path d="M 100 210 L 180 130 L 165 115 L 85 195 Z" 
        fill="#606060" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="95" cy="205" r="8" fill="#808080" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 175 135 L 185 125 M 160 120 L 170 110" 
        stroke="#FFFFFF" stroke-width="3"/>
  
  <!-- L -->
  <path d="M 220 80 L 220 220 M 220 220 L 260 220" 
        stroke="#FFFFFF" stroke-width="8" stroke-linecap="square"/>
  
  <!-- I -->
  <path d="M 290 80 L 290 220 M 280 80 L 300 80 M 280 220 L 300 220" 
        stroke="#FFFFFF" stroke-width="8" stroke-linecap="square"/>
  
  <!-- T -->
  <path d="M 320 80 L 380 80 M 350 80 L 350 220" 
        stroke="#FFFFFF" stroke-width="8" stroke-linecap="square"/>
  
  <!-- E -->
  <path d="M 410 80 L 410 220 M 410 80 L 460 80 M 410 150 L 455 150 M 410 220 L 460 220" 
        stroke="#FFFFFF" stroke-width="8" stroke-linecap="square"/>
  
  <!-- 连字符 -->
  <path d="M 485 150 L 505 150" 
        stroke="#FFFFFF" stroke-width="8" stroke-linecap="square"/>
  
  <!-- A -->
  <path d="M 530 220 L 530 100 L 590 100 L 590 220 M 530 160 L 590 160" 
        stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" fill="none"/>
  
  <!-- I -->
  <path d="M 620 80 L 620 220 M 610 80 L 630 80 M 610 220 L 630 220" 
        stroke="#FFFFFF" stroke-width="8" stroke-linecap="square"/>
</svg>
</body>
</html>
